[package]
name = "stdio"
version = "0.5.0"
edition = "2021"
description = "Terminal output formatting for zega tools"
license = "MIT"
repository = "https://github.com/zegadb/stdio"
homepage = "https://zega.dev"
readme = "README.md"
keywords = ["cli", "terminal", "stdout", "diagnostics", "zega"]
categories = ["command-line-interface", "development-tools"]
authors = ["Sami Fouad"]
# The crate only; the TypeScript package (@zegadb/stdio) shares this repository.
include = [
    "/src/lib.rs",
    "/src/terrace_font.rs",
    "/src/terrace-font.flf",
    "/src/telemetry.rs",
    "/README.md",
    "/LICENSE",
]

# No dependencies by default, deliberately. This crate is linked into publicly
# distributed binaries; by default it formats lines and writes them to stdout
# or stderr, and has no capability to do anything else. Every dependency below
# is optional and comes only with the `telemetry` feature.
[dependencies]
# The telemetry client's blocking HTTPS (rustls with ring, webpki roots; no
# gzip of responses, no cookies, no JSON helpers).
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
# gzip of request bodies (wire §2).
flate2 = { version = "1.1", optional = true }
# Records, batches and the spool's lines.
serde_json = { version = "1.0", optional = true }
# Install and batch ids from the OS's secure random source (wire §4.2).
getrandom = { version = "0.3", optional = true }

[features]
default = []
# The optional telemetry client (stdio::telemetry; docs/telemetry-wire.md).
# Off by default: without it the crate has no dependencies and no network code.
telemetry = ["dep:ureq", "dep:flate2", "dep:serde_json", "dep:getrandom"]

[[test]]
name = "telemetry"
required-features = ["telemetry"]

[package.metadata.docs.rs]
all-features = true
